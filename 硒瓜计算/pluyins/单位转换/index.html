<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>单位转换</title>
<style>
body{margin:0;background:var(--bg-panel-dark,#2d3e4f);color:var(--text-primary,#fff);font-family:system-ui,sans-serif}
.wrap{display:flex;flex-direction:column;gap:10px;padding:14px;height:100vh;box-sizing:border-box}
.type-row{display:flex;align-items:center;gap:10px}
.type-row label{font-size:13px;color:var(--text-secondary,#b0b0b0)}
.type-row select{flex:1;padding:8px 10px;background:#1e2b36;color:#fff;border:1px solid var(--accent,#f39c12);border-radius:8px;font-size:13px;cursor:pointer}
.row{display:flex;flex-direction:column;gap:4px}
.row label{font-size:12px;color:var(--text-secondary,#b0b0b0)}
.group{display:flex;gap:6px}
.group input{flex:2;padding:10px;background:var(--bg-display,#1e2b36);color:var(--text-primary,#fff);border:1px solid var(--border-color,#3a5066);border-radius:8px;font-size:16px;min-width:0}
.group input[readonly]{background:rgba(0,0,0,.2);color:var(--accent,#f39c12);font-weight:bold}
.group select{flex:1.5;padding:8px;background:#1e2b36;color:#fff;border:1px solid var(--border-color,#3a5066);border-radius:8px;font-size:13px;cursor:pointer;min-width:0}
.arrow{text-align:center;color:var(--accent,#f39c12);font-size:18px}
</style>
</head>
<body>
<div class="wrap">
<div class="type-row">
<label>类别：</label>
<select id="type">
<option value="length">📏 长度</option>
<option value="weight">⚖️ 重量</option>
<option value="temperature">🌡️ 温度</option>
<option value="area">▭ 面积</option>
<option value="volume">🧊 体积</option>
</select>
</div>
<div class="row">
<label>从</label>
<div class="group">
<input type="number" id="input" value="1" step="any" inputmode="decimal">
<select id="from"></select>
</div>
</div>
<div class="arrow">↓</div>
<div class="row">
<label>到</label>
<div class="group">
<input type="number" id="output" readonly>
<select id="to"></select>
</div>
</div>
</div>
<script>
(function(){
const UNITS = {
    length: { items:{m:'米',km:'千米',cm:'厘米',mm:'毫米',um:'微米',nm:'纳米',mi:'英里',yd:'码',ft:'英尺',in:'英寸',nmi:'海里'},
              factors:{m:1,km:1000,cm:0.01,mm:0.001,um:1e-6,nm:1e-9,mi:1609.344,yd:0.9144,ft:0.3048,in:0.0254,nmi:1852} },
    weight: { items:{kg:'千克',g:'克',mg:'毫克',t:'吨',lb:'磅',oz:'盎司',ct:'克拉'},
              factors:{kg:1,g:0.001,mg:1e-6,t:1000,lb:0.45359237,oz:0.028349523125,ct:0.0002} },
    temperature: { items:{c:'摄氏度',f:'华氏度',k:'开尔文'} },
    area: { items:{m2:'平方米',km2:'平方千米',cm2:'平方厘米',ha:'公顷',acre:'英亩',ft2:'平方英尺',in2:'平方英寸'},
            factors:{m2:1,km2:1e6,cm2:1e-4,ha:1e4,acre:4046.8564224,ft2:0.09290304,in2:0.00064516} },
    volume: { items:{l:'升',ml:'毫升',m3:'立方米',cm3:'立方厘米',gal:'加仑',qt:'夸脱',pt:'品脱',floz:'液盎司'},
              factors:{l:1,ml:0.001,m3:1000,cm3:0.001,gal:3.785411784,qt:0.946352946,pt:0.473176473,floz:0.0295735295625} }
};
const typeSel = document.getElementById('type');
const fromSel = document.getElementById('from');
const toSel = document.getElementById('to');
const input = document.getElementById('input');
const output = document.getElementById('output');
function fillUnits(){
    const u = UNITS[typeSel.value];
    const keys = Object.keys(u.items);
    const opts = keys.map(k=>`<option value="${k}">${u.items[k]}</option>`).join('');
    fromSel.innerHTML = opts;
    toSel.innerHTML = opts;
    fromSel.value = keys[0];
    toSel.value = keys[1] || keys[0];
    convert();
}
function convert(){
    const t = typeSel.value;
    const v = parseFloat(input.value);
    if(isNaN(v)){ output.value = ''; return; }
    const u = UNITS[t];
    let r;
    if(t==='temperature'){
        const f = fromSel.value, to = toSel.value;
        let c;
        if(f==='c') c = v;
        else if(f==='f') c = (v-32)*5/9;
        else c = v - 273.15;
        if(to==='c') r = c;
        else if(to==='f') r = c*9/5+32;
        else r = c+273.15;
    } else {
        r = v * u.factors[fromSel.value] / u.factors[toSel.value];
    }
    output.value = parseFloat(r.toFixed(10));
}
typeSel.addEventListener('change', fillUnits);
fromSel.addEventListener('change', convert);
toSel.addEventListener('change', convert);
input.addEventListener('input', convert);
fillUnits();
})();
</script>
</body>
</html>
