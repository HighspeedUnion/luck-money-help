<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>日历</title>
<style>
body{margin:0;background:var(--bg-panel-dark,#2d3e4f);color:var(--text-primary,#fff);font-family:system-ui,sans-serif}
.cal{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;height:100vh;box-sizing:border-box}
.bar{display:flex;align-items:center;gap:12px}
.bar button{background:transparent;border:none;color:var(--accent,#f39c12);font-size:18px;cursor:pointer;padding:2px 8px;border-radius:6px}
.bar button:hover{background:var(--btn-bg,#3a5066)}
.month{font-size:15px;font-weight:bold;min-width:100px;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;max-width:300px}
.week span{text-align:center;font-size:12px;font-weight:bold;color:var(--text-secondary,#b0b0b0)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;max-width:300px}
.days button{aspect-ratio:1;background:transparent;border:none;border-radius:50%;font-size:13px;font-weight:bold;color:var(--text-primary,#fff);cursor:pointer}
.days button:hover{background:var(--btn-bg,#3a5066)}
.days button.today{background:var(--accent,#f39c12);color:#fff}
.days button.selected{background:#27ae60;color:#fff}
.sel{margin-top:8px;font-size:13px;color:var(--text-secondary,#b0b0b0)}
</style>
</head>
<body>
<div class="cal">
<div class="bar">
<button id="prev">◀</button>
<div class="month" id="m">----年--月</div>
<button id="next">▶</button>
</div>
<div class="week" id="week"></div>
<div class="days" id="days"></div>
<div class="sel" id="sel">选中的日期: ----</div>
</div>
<script>
(function(){
const weekNames = ['日','一','二','三','四','五','六'];
document.getElementById('week').innerHTML = weekNames.map(w=>`<span>${w}</span>`).join('');
let ym = new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
let selected = new Date();
function render(){
    const [y,m] = ym.split('-').map(Number);
    document.getElementById('m').textContent = y+'年 '+String(m).padStart(2,'0')+'月';
    const first = new Date(y,m-1,1);
    const days = new Date(y,m,0).getDate();
    const start = first.getDay();
    const grid = document.getElementById('days');
    grid.innerHTML = '';
    for(let i=0;i<start;i++) grid.appendChild(document.createElement('span'));
    const today = new Date();
    for(let d=1;d<=days;d++){
        const b = document.createElement('button');
        b.textContent = d;
        const dt = new Date(y,m-1,d);
        if(dt.toDateString()===today.toDateString()) b.classList.add('today');
        if(dt.toDateString()===selected.toDateString()) b.classList.add('selected');
        b.addEventListener('click',()=>{
            selected = dt;
            document.getElementById('sel').textContent = '选中的日期: '+y+'年'+String(m).padStart(2,'0')+'月'+String(d).padStart(2,'0')+'日';
            render();
        });
        grid.appendChild(b);
    }
    const total = start+days;
    const rest = (7-total%7)%7;
    for(let i=0;i<rest;i++) grid.appendChild(document.createElement('span'));
    document.getElementById('sel').textContent = '选中的日期: '+selected.getFullYear()+'年'+String(selected.getMonth()+1).padStart(2,'0')+'月'+String(selected.getDate()).padStart(2,'0')+'日';
}
document.getElementById('prev').addEventListener('click',()=>{
    let [y,m] = ym.split('-').map(Number);
    m--; if(m===0){m=12;y--;}
    ym = y+'-'+String(m).padStart(2,'0');
    render();
});
document.getElementById('next').addEventListener('click',()=>{
    let [y,m] = ym.split('-').map(Number);
    m++; if(m===13){m=1;y++;}
    ym = y+'-'+String(m).padStart(2,'0');
    render();
});
render();
})();
</script>
</body>
</html>
