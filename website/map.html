<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 风格网站地图</title>
    
    <!-- 这行就是你要加的图标代码 -->
    <link rel="icon" href="./map.png" type="image/png">
    
    <!-- 引入像素风字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* ... 下面接着你原来的 CSS 样式 ... */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 地图容器 */
        .map-container {
            position: relative;
            width: 800px; /* 可以根据需要调整大小 */
            max-width: 95vw;
            border: 4px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* 地图背景图片 */
        .map-bg {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated; /* 保持像素锐利 */
            image-rendering: crisp-edges;
        }

        /* 通用标记点样式 */
        .marker {
            position: absolute;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            padding: 8px 12px;
            text-decoration: none;
            border: 2px solid #ffffff;
            text-shadow: 2px 2px 0 #000;
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
            cursor: pointer;
            z-index: 10;
        }

        /* 鼠标悬停效果 */
        .marker:hover {
            background-color: rgba(50, 205, 50, 0.9); /* 亮绿色 */
            border-color: #ffff00; /* 黄色边框 */
            color: #000000;
            text-shadow: none;
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 10px #ffff00;
        }

        /* 左下角版权/出处标注 */
        .credit {
            position: absolute;
            bottom: 8px;
            left: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            color: #ffffff;
            text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; /* 描边提升可读性 */
            z-index: 10;
        }

        .credit a {
            color: #8ab4f8;
            text-decoration: none;
        }

        .credit a:hover {
            text-decoration: underline;
        }

        /* 针对移动端稍微缩小字体 */
        @media (max-width: 600px) {
            .marker { font-size: 8px; padding: 4px 6px; }
            .credit { font-size: 6px; }
        }
    </style>
</head>
<body>

    <div class="map-container">
        <!-- 请确保这里的图片名称和你保存的图片名称一致，例如 map.png -->
        <img src="map.png" alt="Minecraft Map" class="map-bg">

        <!-- 标记点：你可以通过修改 top 和 left 的百分比来调整位置 -->
        
        <!-- 1. 退出官网 (右上角岛屿) -->
        <a href="hao.bing.com" class="marker" style="top: 18%; left: 78%;">退出官网</a>

        <!-- 2. 简介 (地图中心) -->
        <a href="./my.html" class="marker" style="top: 50%; left: 45%;">简介</a>

        <!-- 3. 文档 (左上角) -->
        <a href="./note.html" class="marker" style="top: 25%; left: 20%;">文档</a>

        <!-- 4. 反馈 (下方中间) -->
        <a href="./feedback.html" class="marker" style="top: 80%; left: 55%;">反馈</a>

        <!-- 5. 网页版工具 (右侧大陆) -->
        <a href="./websitehelp.html" class="marker" style="top: 55%; left: 85%;">网页版工具</a>

        <!-- 6. 下载 (左下角雪地) -->
        <a href="./download.html" class="marker" style="top: 85%; left: 15%;">下载</a>

        <!-- 左下角出处标注 -->
        <div class="credit">
            图片来自于: <a href="https://zh.minecraft.wiki/w/%E5%9C%B0%E5%9B%BE#/media/File:12w34b_-_map_zoom1.png" target="_blank">Minecraft Wiki</a>
        </div>
    </div>

</body>
</html>
