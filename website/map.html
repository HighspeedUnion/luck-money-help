<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站地图</title>
    
    <!-- 网站图标 (带有 v=3 防缓存) -->
    <link rel="icon" type="image/png" href="https://gaosuliansi.us.ci/map_32.png?v=3">
    <link rel="shortcut icon" type="image/png" href="https://gaosuliansi.us.ci/map_32.png?v=3">
    
    <!-- 引入像素风字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 地图容器：锁定正方形，防止图片加载慢导致页面崩溃 */
        .map-container {
            position: relative;
            width: 800px; 
            max-width: 95vw;
            aspect-ratio: 1 / 1; 
            border: 4px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background-color: #333;
        }

        /* 地图背景图片 */
        .map-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
            z-index: 1; 
        }

        /* 标记点 */
        .marker {
            position: absolute;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            padding: 8px 12px;
            text-decoration: none;
            border: 2px solid #ffffff;
            text-shadow: 2px 2px 0 #000;
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
            cursor: pointer;
            z-index: 10; 
        }

        .marker:hover {
            background-color: rgba(50, 205, 50, 0.9);
            border-color: #ffff00;
            color: #000000;
            text-shadow: none;
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 10px #ffff00;
        }

        /* 左下角标注 */
        .credit {
            position: absolute;
            bottom: 8px;
            left: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            color: #ffffff;
            text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; 
            z-index: 10;
        }

        .credit a {
            color: #8ab4f8;
            text-decoration: none;
        }

        .credit a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .marker { font-size: 8px; padding: 4px 6px; }
            .credit { font-size: 6px; }
        }
    </style>
</head>
<body>

    <div class="map-container">
        <img src="https://gaosuliansi.us.ci/map.png" alt="Minecraft Map" class="map-bg">

        <a href="hao.bing.com" class="marker" style="top: 18%; left: 78%;">退出官网</a>
        <a href="./my.html" class="marker" style="top: 50%; left: 45%;">简介</a>
        <a href="./note.html" class="marker" style="top: 25%; left: 20%;">文档</a>
        <a href="./feedback.html" class="marker" style="top: 80%; left: 55%;">反馈</a>
        <a href="./websitehelp.html" class="marker" style="top: 55%; left: 85%;">网页版工具</a>
        <a href="./download.html" class="marker" style="top: 85%; left: 15%;">下载</a>

        <div class="credit">
            图片来自于: <a href="https://zh.minecraft.wiki/w/%E5%9C%B0%E5%9B%BE#/media/File:12w34b_-_map_zoom1.png" target="_blank">Minecraft Wiki</a>
        </div>
    </div>

</body>
</html>
