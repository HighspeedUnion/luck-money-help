
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载 硒瓜计算</title>
<!-- 设置浏览器标签页头的 LOGO -->
<link rel="icon" href="./calculatorlogo.png" type="image/png">
<style>
  :root{
    --bg:#0b0f17;
    --card:#151b26;
    --card-hover:#1b2231;
    --border:rgba(255,255,255,.08);
    --border-hover:rgba(120,160,255,.45);
    --text:#e8edf7;
    --muted:#8b97ad;
    --accent:#5b8cff;
    --accent-2:#8b5cf6;
    --green:#34d399;
    --radius:18px;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  /* 背景光晕 */
  body::before{
    content:"";
    position:fixed;
    top:-320px;left:50%;
    transform:translateX(-50%);
    width:1100px;height:760px;
    background:radial-gradient(circle at center,rgba(91,140,255,.22),rgba(139,92,246,.10) 45%,transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:1080px;
    margin:0 auto;
    padding:0 24px 80px;
  }

  /* ============ 顶部导航 ============ */
  header{
    display:flex;
    align-items:center;
    padding:26px 0 0;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:700;
    font-size:19px;
    letter-spacing:.3px;
  }

  .logo-img{
    width:38px;
    height:38px;
    border-radius:11px;
    object-fit:cover;
    box-shadow:0 6px 22px rgba(91,140,255,.35);
  }

  /* ============ 主标题 ============ */
  .section-title{
    text-align:center;
    font-size:32px;
    font-weight:800;
    margin:60px 0 40px;
    letter-spacing:2px;
  }

  /* ============ 平台卡片 ============ */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
  }

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    display:flex;
    align-items:center;
    gap:20px;
    transition:transform .25s cubic-bezier(.2,.8,.3,1),
               border-color .25s,
               background .25s,
               box-shadow .25s;
    overflow:hidden;
  }

  .card::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(91,140,255,.13),transparent 62%);
    opacity:0;
    transition:opacity .3s;
    pointer-events:none;
  }

  .card:hover{
    transform:translateY(-4px);
    background:var(--card-hover);
    border-color:var(--border-hover);
    box-shadow:0 18px 44px -16px rgba(0,0,0,.75);
  }

  .card:hover::after{opacity:1}

  .card.detected{
    border-color:rgba(91,140,255,.5);
    box-shadow:0 0 0 1px rgba(91,140,255,.18),0 18px 44px -18px rgba(91,140,255,.45);
  }

  .badge-detected{
    position:absolute;
    top:14px;right:14px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.4px;
    padding:3px 9px;
    border-radius:999px;
    background:rgba(52,211,153,.13);
    color:var(--green);
    border:1px solid rgba(52,211,153,.32);
  }

  .icon-box{
    flex:0 0 auto;
    width:56px;height:56px;
    border-radius:15px;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    transition:background .25s,border-color .25s;
  }

  .card:hover .icon-box{
    background:rgba(91,140,255,.14);
    border-color:rgba(91,140,255,.32);
  }

  .icon-box svg{
    width:28px;height:28px;
    fill:#cfd9ea;
    transition:fill .25s;
  }

  .card:hover .icon-box svg{fill:#fff}

  .card-main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .card-main h3{
    font-size:18px;
    font-weight:700;
    white-space: nowrap;
  }

  /* 下载按钮 */
  .dl-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:600;
    padding:8px 24px;
    border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border:1px solid transparent;
    color:#fff;
    text-decoration:none;
    transition:all .18s;
    box-shadow:0 6px 18px -6px rgba(91,140,255,.7);
  }

  .dl-btn:hover{
    filter:brightness(1.12);
    transform:translateY(-1px);
  }

  /* ============ 响应式 ============ */
  @media (max-width:720px){
    .grid{grid-template-columns:1fr}
    .wrap{padding:0 18px 60px}
    .section-title{font-size:26px;margin:40px 0 24px;}
    .card{padding:20px;}
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- 顶部仅保留 Logo -->
  <header>
    <div class="logo">
      <img src="./logo.png" alt="logo.png.png" class="logo-img">
      Nimbus
    </div>
  </header>

  <!-- 标题 -->
  <h2 class="section-title">下载</h2>

  <!-- 平台卡片 -->
  <section class="grid" id="download">

    <!-- Windows -->
    <div class="card" data-os="windows">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M3 5.6 10.2 4.6v7.1H3V5.6Zm0 12.8 7.2 1v-7H3v6Zm8.4 1.2L21 21V12.7h-9.6v6.9Zm0-15.2v7.3H21V3l-9.6 1.4Z"/></svg>
      </div>
      <div class="card-main">
        <h3>Windows</h3>
        <a class="dl-btn" href="./winedows.zip">下载</a>
      </div>
    </div>

    <!-- macOS -->
    <div class="card" data-os="mac">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-2.9-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.3 2.7 2.2 1.1 0 1.5-.7 2.9-.7s1.7.7 2.9.7c1.2 0 2-1.1 2.7-2.2.8-1.2 1.2-2.4 1.2-2.5-.1 0-2.2-.9-2.2-3.6ZM14.3 5.6c.6-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.1 1.8-1 2.9 1.1.1 2.2-.6 2.8-1.4Z"/></svg>
      </div>
      <div class="card-main">
        <h3>macOS</h3>
        <a class="dl-btn" href="./mas.zip">下载</a>
      </div>
    </div>

    <!-- Linux -->
    <div class="card" data-os="linux">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M12 2c-1.9 0-3.4 1.6-3.4 3.6 0 1.2.2 2 .2 3 0 1-1.2 1.9-1.9 3.4-.8 1.6-1.4 3-1.4 4.5 0 2.4 1.7 3.9 3.1 3.9.7 0 1.1-.3 1.7-.3.5 0 .8.3 1.7.3s1.2-.3 1.7-.3c.6 0 1 .3 1.7.3 1.4 0 3.1-1.5 3.1-3.9 0-1.5-.6-2.9-1.4-4.5-.7-1.5-1.9-2.4-1.9-3.4 0-1 .2-1.8.2-3C15.4 3.6 13.9 2 12 2Zm-1.3 3.4c.4 0 .7.4.7.9s-.3.9-.7.9-.7-.4-.7-.9.3-.9.7-.9Zm2.6 0c.4 0 .7.4.7.9s-.3.9-.7.9-.7-.4-.7-.9.3-.9.7-.9Zm-1.3 2.2c.7 0 1.4.5 1.4.9 0 .4-.7.9-1.4.9s-1.4-.5-1.4-.9c0-.4.7-.9 1.4-.9Z"/></svg>
      </div>
      <div class="card-main">
        <h3>Linux</h3>
        <a class="dl-btn" href="./linux.zip">下载</a>
      </div>
    </div>

    <!-- Android -->
    <div class="card" data-os="android">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M6.6 9.3h10.8c.5 0 .9.4.9.9v6.6a1.9 1.9 0 0 1-1.9 1.9h-.5v2.2a1.1 1.1 0 0 1-2.2 0v-2.2h-3.4v2.2a1.1 1.1 0 0 1-2.2 0v-2.2h-.5a1.9 1.9 0 0 1-1.9-1.9v-6.6c0-.5.4-.9.9-.9Zm-2.3.2c.6 0 1.1.5 1.1 1.1v4.9a1.1 1.1 0 0 1-2.2 0v-4.9c0-.6.5-1.1 1.1-1.1Zm15.4 0c.6 0 1.1.5 1.1 1.1v4.9a1.1 1.1 0 0 1-2.2 0v-4.9c0-.6.5-1.1 1.1-1.1ZM8.2 8.1 7 6.1a.3.3 0 0 1 .5-.3l1.2 2a6.9 6.9 0 0 1 3.3-.8c1.2 0 2.3.3 3.3.8l1.2-2a.3.3 0 0 1 .5.3l-1.2 2a6 6 0 0 1 3.3 5.1H4.9a6 6 0 0 1 3.3-5.1Zm1.9 2.6a.6.6 0 1 0 0-1.2.6.6 0 0 0 0 1.2Zm3.8 0a.6.6 0 1 0 0-1.2.6.6 0 0 0 0 1.2Z"/></svg>
      </div>
      <div class="card-main">
        <h3>Android</h3>
        <a class="dl-btn" href="./android.apk">下载</a>
      </div>
    </div>

  </section>

</div>

<script>
  /* ---------- 自动识别当前系统，高亮对应卡片 ---------- */
  (function () {
    const ua = navigator.userAgent;
    const platform = navigator.platform || '';
    let os = null;

    if (/Android/i.test(ua)) os = 'android';
    else if (/Win/i.test(ua) || /Win/i.test(platform)) os = 'windows';
    else if (/Mac/i.test(ua) && !/iPhone|iPad/i.test(ua)) os = 'mac';
    else if (/Linux|X11/i.test(ua) || /Linux/i.test(platform)) os = 'linux';

    if (!os) return;

    const card = document.querySelector(`.card[data-os="${os}"]`);
    if (!card) return;

    card.classList.add('detected');

    const badge = document.createElement('span');
    badge.className = 'badge-detected';
    badge.textContent = '当前系统';
    card.appendChild(badge);
  })();

  /* ---------- 卡片跟随鼠标的柔和光斑 ---------- */
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
</script>

</body>
</html>
