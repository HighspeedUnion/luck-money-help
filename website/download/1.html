<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载 硒瓜计算</title>
<link rel="icon" href="./logo.png" type="image/png">
<style>
  :root{
    --bg:#0b0f17;
    --card:#151b26;
    --card-hover:#1b2231;
    --border:rgba(255,255,255,.08);
    --border-hover:rgba(120,160,255,.45);
    --text:#e8edf7;
    --muted:#8b97ad;
    --accent:#5b8cff;
    --accent-2:#8b5cf6;
    --green:#34d399;
    --radius:18px;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  /* 背景光晕 */
  body::before{
    content:"";
    position:fixed;
    top:-320px;left:50%;
    transform:translateX(-50%);
    width:1100px;height:760px;
    background:radial-gradient(circle at center,rgba(91,140,255,.22),rgba(139,92,246,.10) 45%,transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:1080px;
    margin:0 auto;
    padding:0 24px 80px;
  }

  /* ============ 顶部导航 ============ */
  header{
    display:flex;
    align-items:center;
    padding:26px 0 0;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:700;
    font-size:19px;
    letter-spacing:.3px;
  }

  .logo-img{
    width:38px;
    height:38px;
    border-radius:11px;
    object-fit:cover;
    box-shadow:0 6px 22px rgba(91,140,255,.35);
  }

  /* ============ 主标题 ============ */
  .section-title{
    text-align:center;
    font-size:32px;
    font-weight:800;
    margin:60px 0 40px;
    letter-spacing:2px;
  }

  /* ============ 平台卡片 ============ */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
  }

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    display:flex;
    align-items:center;
    gap:20px;
    transition:transform .25s cubic-bezier(.2,.8,.3,1),
               border-color .25s,
               background .25s,
               box-shadow .25s;
    overflow:hidden;
  }

  .card::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(91,140,255,.13),transparent 62%);
    opacity:0;
    transition:opacity .3s;
    pointer-events:none;
  }

  .card:hover{
    transform:translateY(-4px);
    background:var(--card-hover);
    border-color:var(--border-hover);
    box-shadow:0 18px 44px -16px rgba(0,0,0,.75);
  }

  .card:hover::after{opacity:1}

  .card.detected{
    border-color:rgba(91,140,255,.5);
    box-shadow:0 0 0 1px rgba(91,140,255,.18),0 18px 44px -18px rgba(91,140,255,.45);
  }

  .badge-detected{
    position:absolute;
    top:14px;right:14px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.4px;
    padding:3px 9px;
    border-radius:999px;
    background:rgba(52,211,153,.13);
    color:var(--green);
    border:1px solid rgba(52,211,153,.32);
  }

  .icon-box{
    flex:0 0 auto;
    width:56px;height:56px;
    border-radius:15px;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    transition:background .25s,border-color .25s;
  }

  .card:hover .icon-box{
    background:rgba(91,140,255,.14);
    border-color:rgba(91,140,255,.32);
  }

  .icon-box svg{
    width:28px;height:28px;
    fill:#cfd9ea;
    transition:fill .25s;
  }

  .card:hover .icon-box svg{fill:#fff}

  .card-main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-width: 0; /* 防止内容溢出 */
  }

  .card-main h3{
    font-size:18px;
    font-weight:700;
    white-space: nowrap;
  }

  /* 按钮组 */
  .btn-group{
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* 下载按钮通用样式 */
  .dl-btn{
    position: relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    font-size:13.5px;
    font-weight:600;
    padding:7px 14px;
    border-radius:9px;
    text-decoration:none;
    transition:all .2s;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .dl-btn svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
  }

  /* GitLink 按钮（默认样式） */
  .dl-btn.gitlink-btn {
    background: rgba(255,255,255,.06);
    color: #d7e0ef;
    border-color: var(--border);
  }
  .dl-btn.gitlink-btn:hover {
    background: rgba(255,255,255,.11);
    border-color: rgba(255,255,255,.2);
    color: #fff;
  }

  /* GitHub 按钮（默认样式） */
  .dl-btn.github-btn {
    background: #24292f;
    color: #fff;
    border-color: #3b434b;
  }
  .dl-btn.github-btn:hover {
    background: #2f363d;
    border-color: #57606a;
  }

  /* 推荐状态（通过 JS 动态加上 .recommend 类） */
  .dl-btn.recommend.gitlink-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px -4px rgba(91,140,255,.6);
  }
  .dl-btn.recommend.gitlink-btn:hover {
    filter: brightness(1.12);
    transform: translateY(-1px);
  }

  .dl-btn.recommend.github-btn {
    background: #238636;
    color: #fff;
    border-color: #2ea043;
    box-shadow: 0 4px 14px -4px rgba(35,134,54,.6);
  }
  .dl-btn.recommend.github-btn:hover {
    background: #2ea043;
    transform: translateY(-1px);
  }

  /* 推荐角标 */
  .recommend-tag {
    position: absolute;
    top: -10px;
    right: -6px;
    background: var(--green);
    color: #000;
    font-size: 10px;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    pointer-events: none;
  }

  /* ============ 响应式 ============ */
  @media (max-width: 820px) {
    .card-main {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .btn-group {
      width: 100%;
    }
    .dl-btn {
      flex: 1;
      padding: 8px 10px;
    }
  }

  @media (max-width: 720px){
    .grid{grid-template-columns:1fr}
    .wrap{padding:0 18px 60px}
    .section-title{font-size:26px;margin:40px 0 24px;}
    .card{padding:20px;}
  }
</style>

<script>
  /* ---------- 1. 自动识别当前系统，高亮卡片 ---------- */
  (function () {
    const ua = navigator.userAgent;
    const platform = navigator.platform || '';
    let os = null;

    if (/Android/i.test(ua)) os = 'android';
    else if (/Win/i.test(ua) || /Win/i.test(platform)) os = 'windows';
    else if (/Mac/i.test(ua) && !/iPhone|iPad/i.test(ua)) os = 'mac';
    else if (/Linux|X11/i.test(ua) || /Linux/i.test(platform)) os = 'linux';

    if (!os) return;

    const card = document.querySelector(`.card[data-os="${os}"]`);
    if (!card) return;

    card.classList.add('detected');

    const badge = document.createElement('span');
    badge.className = 'badge-detected';
    badge.textContent = '当前系统';
    card.appendChild(badge);
  })();

  /* ---------- 2. 自动识别地区推荐下载源 ---------- */
  (function () {
    // 判断是否为中国大陆环境：语言是中文 或 时区为上海/重庆/乌鲁木齐等
    const lang = navigator.language || navigator.userLanguage || '';
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    
    const isChina = lang === 'zh-CN' || lang === 'zh' || 
                    tz === 'Asia/Shanghai' || tz === 'Asia/Chongqing' || 
                    tz === 'Asia/Urumqi' || tz === 'Asia/Harbin';

    const gitlinkBtns = document.querySelectorAll('.gitlink-btn');
    const githubBtns = document.querySelectorAll('.github-btn');

    if (isChina) {
      // 国内环境推荐 GitLink
      gitlinkBtns.forEach(btn => {
        btn.classList.add('recommend');
        const tag = document.createElement('span');
        tag.className = 'recommend-tag';
        tag.textContent = '推荐';
        btn.appendChild(tag);
      });
    } else {
      // 海外环境推荐 GitHub
      githubBtns.forEach(btn => {
        btn.classList.add('recommend');
        const tag = document.createElement('span');
        tag.className = 'recommend-tag';
        tag.textContent = '推荐';
        btn.appendChild(tag);
      });
    }
  })();

  /* ---------- 3. 卡片跟随鼠标的柔和光斑 ---------- */
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
</script>

</body>
</html>
