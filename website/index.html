<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎来到高速连司官方网站</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        overflow: hidden;
    }

    body {
        font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        background: #050b1a;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        color: #fff;
    }

    /* 背景渐变光晕 */
    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 20% 20%, rgba(0, 140, 255, 0.35), transparent 55%),
            radial-gradient(circle at 80% 80%, rgba(0, 255, 200, 0.22), transparent 55%),
            linear-gradient(160deg, #050b1a 0%, #0a1a33 50%, #04101f 100%);
        z-index: 0;
    }

    /* 高速公路流动线条 */
    .road-lines {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        opacity: 0.5;
    }

    .road-lines span {
        position: absolute;
        top: -40%;
        width: 2px;
        height: 40%;
        background: linear-gradient(to bottom, transparent, rgba(90, 200, 255, 0.9), transparent);
        animation: fall linear infinite;
    }

    @keyframes fall {
        0%   { transform: translateY(0); opacity: 0; }
        15%  { opacity: 1; }
        100% { transform: translateY(350%); opacity: 0; }
    }

    /* 主内容 */
    .wrap {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 40px 24px;
        max-width: 900px;
        animation: fadeUp 1.2s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(36px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
        font-weight: 700;
        line-height: 1.35;
        letter-spacing: 2px;
    }

    h1 .line1 {
        display: block;
        font-size: clamp(26px, 5vw, 46px);
        color: #cfe8ff;
        font-weight: 400;
        letter-spacing: 8px;
        margin-bottom: 14px;
        animation: fadeUp 1.2s 0.15s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    }

    h1 .line2 {
        display: block;
        font-size: clamp(34px, 7.5vw, 72px);
        background: linear-gradient(92deg, #ffffff 0%, #6fd6ff 45%, #39ffc8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 26px rgba(60, 190, 255, 0.35));
        animation: fadeUp 1.2s 0.3s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    }

    /* 按钮 */
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 60px;
        padding: 17px 52px;
        font-size: clamp(16px, 2.2vw, 19px);
        font-weight: 600;
        letter-spacing: 3px;
        color: #041018;
        text-decoration: none;
        border-radius: 999px;
        background: linear-gradient(92deg, #6fd6ff, #39ffc8);
        box-shadow: 0 10px 34px rgba(57, 200, 255, 0.35);
        transition: transform 0.28s ease, box-shadow 0.28s ease, filter 0.28s ease;
        animation: fadeUp 1.2s 0.45s cubic-bezier(0.2, 0.8, 0.3, 1) both;
        position: relative;
        overflow: hidden;
    }

    .btn:hover {
        transform: translateY(-4px) scale(1.03);
        box-shadow: 0 18px 46px rgba(57, 220, 255, 0.55);
        filter: brightness(1.08);
    }

    .btn:active {
        transform: translateY(-1px) scale(0.99);
    }

    .btn .arrow {
        transition: transform 0.28s ease;
        font-size: 1.1em;
    }

    .btn:hover .arrow {
        transform: translateX(6px);
    }

    /* 按钮扫光 */
    .btn::after {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 60%;
        height: 100%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        transform: skewX(-20deg);
        transition: left 0.7s ease;
    }

    .btn:hover::after {
        left: 130%;
    }

    @media (max-width: 480px) {
        .btn { padding: 15px 38px; letter-spacing: 2px; }
        h1 .line1 { letter-spacing: 5px; }
    }
</style>
</head>
<body>

    <!-- 背景流动线条 -->
    <div class="road-lines" id="lines"></div>

    <main class="wrap">
        <h1>
            <span class="line1">欢迎来到</span>
            <span class="line2">高速连司官方网站</span>
        </h1>

        <a class="btn" href="main.html">
            进入官网
            <span class="arrow">→</span>
        </a>
    </main>

<script>
    // 生成随机分布的流动光柱
    (function () {
        const box = document.getElementById('lines');
        const count = window.innerWidth < 600 ? 14 : 26;
        for (let i = 0; i < count; i++) {
            const s = document.createElement('span');
            s.style.left = Math.random() * 100 + '%';
            s.style.animationDuration = (2.6 + Math.random() * 3.4).toFixed(2) + 's';
            s.style.animationDelay = (-Math.random() * 6).toFixed(2) + 's';
            s.style.opacity = (0.25 + Math.random() * 0.6).toFixed(2);
            s.style.height = (25 + Math.random() * 45) + '%';
            box.appendChild(s);
        }
    })();
</script>

</body>
</html>
